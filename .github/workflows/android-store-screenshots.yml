name: NavoTap Android Store Screenshots

on:
  pull_request:
    paths:
      - 'android/**'
      - 'OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/scripts/capture-android-store-screenshots.sh'
      - '.github/workflows/android-store-screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/scripts/capture-android-store-screenshots.sh'
      - '.github/workflows/android-store-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NAVOTAP_ADMOB_APP_ID: ca-app-pub-8944085355624754~8281696102
      NAVOTAP_REWARDED_AD_ID: ca-app-pub-8944085355624754/1572817522
      NAVOTAP_INTERSTITIAL_AD_ID: ca-app-pub-8944085355624754/1963699766
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build release-appearance APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p android assembleRelease --stacktrace
          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$unsigned"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/screenshot.jks" -storepass android -alias screenshot -keypass android -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Screenshot'
          mkdir -p build
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/screenshot.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias screenshot --out build/navotap-store-screenshot.apk "$unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/navotap-store-screenshot.apk
      - name: Capture real release-appearance UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: WAIT_TEXT='NAVOTAP' PACKAGE_NAME='com.kamilunavo.onemoretap' APK_PATH='build/navotap-store-screenshot.apk' OUTPUT_DIR='android/store/google-play/screenshots/de-DE' SECOND_ACTION='tap' TAP_X='540' TAP_Y='1200' SECOND_WAIT_TEXT='TAP ANYWHERE' bash "$GITHUB_WORKSPACE/.github/scripts/capture-android-store-screenshots.sh"
      - name: Reject QA-only screenshot surface
        run: |
          grep -Fq 'buildConfigField("boolean", "USES_TEST_ADS", "false")' android/app/build.gradle.kts
          test -s android/store/google-play/screenshots/de-DE/01-current-ui.png
      - uses: actions/upload-artifact@v4
        with:
          name: NavoTap-authentic-release-Android-store-screenshots
          path: android/store/google-play/screenshots/de-DE/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Persist verified emulator screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/store/google-play/screenshots/de-DE
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'store(android): refresh authentic NavoTap screenshots'
          git push
