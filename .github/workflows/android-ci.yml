name: Android CI

on:
  push:
    branches:
      - main
      - 'android/**'
      - fix/android-ios-parity
    paths:
      - 'android/**'
      - 'OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Lock NavoTap launcher identity before build
        shell: bash
        run: |
          set -euo pipefail
          manifest='android/app/src/main/AndroidManifest.xml'
          canonical='OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          test -s "$manifest"
          test -s "$canonical"
          grep -Fq 'android:icon="@drawable/navotap_app_icon"' "$manifest"
          ! grep -Fq 'android:roundIcon=' "$manifest"
          grep -Fq 'Assets.xcassets/AppIcon.appiconset/AppIcon.png' android/app/build.gradle.kts
          grep -Fq 'rename { "navotap_app_icon.png" }' android/app/build.gradle.kts
          test -z "$(find android/app/src/main/res -type f \( -path '*/mipmap-anydpi*' -o -iname '*adaptive*' -o -iname '*foreground*' -o -iname '*background*' \) -print -quit)"
          echo 'NavoTap launcher identity is locked directly to the iOS AppIcon.'
      - name: Classic engine parity tests on release variant
        env:
          NAVOTAP_ADMOB_APP_ID: ca-app-pub-8944085355624754~8281696102
          NAVOTAP_REWARDED_AD_ID: ca-app-pub-8944085355624754/1572817522
          NAVOTAP_INTERSTITIAL_AD_ID: ca-app-pub-8944085355624754/1963699766
        run: gradle -p android testReleaseUnitTest --stacktrace
      - name: Build Android QA bundle with Google test ads
        run: gradle -p android bundleDebug --stacktrace
      - name: Verify Android identity, ads, adaptive icon and startup guards
        run: |
          set -euo pipefail
          ui='android/app/src/main/java/com/kamilunavo/onemoretap/MainActivity.kt'
          grep -q 'applicationId = "com.kamilunavo.onemoretap"' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'versionCode = 6' android/app/build.gradle.kts
          grep -q 'versionName = "1.0.5"' android/app/build.gradle.kts
          grep -q 'isMinifyEnabled = false' android/app/build.gradle.kts
          grep -q 'testBuildType = "release"' android/app/build.gradle.kts
          grep -q 'android:icon="@drawable/navotap_app_icon"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          cmp -s OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png android/app/build/generated/navotapIcon/res/drawable-nodpi/navotap_app_icon.png
          grep -q 'com.kamilunavo.onemoretap.removeads' android/app/src/main/java/com/kamilunavo/onemoretap/PlayerProfile.kt
          grep -q 'om.kamilunavo.onemoretap.theme.fire' android/app/src/main/java/com/kamilunavo/onemoretap/PlayerProfile.kt
          grep -q 'play-services-ads:25.4.0' android/app/build.gradle.kts
          grep -q 'user-messaging-platform:4.0.0' android/app/build.gradle.kts
          grep -q 'robolectric:4.16' android/app/build.gradle.kts
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' android/app/src/main/AndroidManifest.xml
          grep -q 'handler.postDelayed' android/app/src/main/java/com/kamilunavo/onemoretap/BillingManager.kt
          grep -q '1_500L' android/app/src/main/java/com/kamilunavo/onemoretap/BillingManager.kt
          grep -q '1_500L' android/app/src/main/java/com/kamilunavo/onemoretap/AdManager.kt
          grep -q 'fun retryRewarded(activity: Activity)' android/app/src/main/java/com/kamilunavo/onemoretap/AdManager.kt
          grep -q 'interstitialRetryScheduled' android/app/src/main/java/com/kamilunavo/onemoretap/AdManager.kt
          grep -q '1_200L' android/app/src/main/java/com/kamilunavo/onemoretap/AdManager.kt
          grep -q 'scheduleInterstitialRetry' android/app/src/main/java/com/kamilunavo/onemoretap/AdManager.kt
          grep -q 'ads.retryRewarded(activity)' "$ui"
          grep -q 'onSurface = Color.White' "$ui"
          grep -Fq 'statusBarsPadding()' "$ui"
          grep -Fq 'navigationBarsPadding()' "$ui"
          grep -Fq 'PRIVACY OPTIONS' "$ui"
          grep -Fq 'Themes are cosmetic only. Purchases never change hitboxes, scoring or difficulty.' "$ui"
          ! grep -Fq 'private fun SettingsScreen' "$ui"
          ! grep -Fq 'private fun SettingToggle' "$ui"
          test -s android/app/src/test/java/com/kamilunavo/onemoretap/MainActivityStartupTest.kt
      - name: Prove release cannot build without Android AdMob IDs
        run: |
          set +e
          gradle -p android bundleRelease --stacktrace > /tmp/navotap-release-guard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release unexpectedly built without production Android AdMob IDs"
            exit 1
          fi
          grep -q 'NavoTap release requires NAVOTAP_ADMOB_APP_ID' /tmp/navotap-release-guard.log
      - name: Upload QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: NavoTap-1.0.5-6-android-qa-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7

  startup_smoke:
    name: Release startup smoke (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAVOTAP_ADMOB_APP_ID: ca-app-pub-8944085355624754~8281696102
      NAVOTAP_REWARDED_AD_ID: ca-app-pub-8944085355624754/1572817522
      NAVOTAP_INTERSTITIAL_AD_ID: ca-app-pub-8944085355624754/1963699766
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Launch release MainActivity past delayed Google SDK startup
        run: |
          set -euo pipefail
          gradle -p android testReleaseUnitTest \
            --tests com.kamilunavo.onemoretap.MainActivityStartupTest \
            --stacktrace
