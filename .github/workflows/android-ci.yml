name: Android CI

on:
  push:
    branches:
      - 'android/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Classic engine parity tests
        run: gradle -p android testDebugUnitTest --stacktrace

      - name: Build Android QA bundle with Google test ads
        run: gradle -p android bundleDebug --stacktrace

      - name: Verify Android identity and monetization guards
        run: |
          grep -q 'applicationId = "com.kamilunavo.onemoretap"' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'versionCode = 1' android/app/build.gradle.kts
          grep -q 'com.kamilunavo.onemoretap.removeads' android/app/src/main/java/com/kamilunavo/onemoretap/PlayerProfile.kt
          grep -q 'om.kamilunavo.onemoretap.theme.fire' android/app/src/main/java/com/kamilunavo/onemoretap/PlayerProfile.kt
          grep -q 'play-services-ads:25.4.0' android/app/build.gradle.kts
          grep -q 'user-messaging-platform:4.0.0' android/app/build.gradle.kts

      - name: Prove release cannot build without Android AdMob IDs
        run: |
          set +e
          gradle -p android bundleRelease --stacktrace > /tmp/navotap-release-guard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release unexpectedly built without production Android AdMob IDs"
            exit 1
          fi
          grep -q 'NavoTap release requires NAVOTAP_ADMOB_APP_ID' /tmp/navotap-release-guard.log

      - name: Upload QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: NavoTap-android-qa-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7
