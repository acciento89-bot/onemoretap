name: Android CI

on:
  push:
    branches:
      - 'android/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Classic engine parity tests
        run: gradle -p android testDebugUnitTest --stacktrace

      - name: Build Android QA bundle with Google test ads
        run: gradle -p android bundleDebug --stacktrace

      - name: Verify Android identity, monetization and startup guards
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.kamilunavo.onemoretap"' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'versionCode = 2' android/app/build.gradle.kts
          grep -q 'versionName = "1.0.1"' android/app/build.gradle.kts
          grep -q 'com.kamilunavo.onemoretap.removeads' android/app/src/main/java/com/kamilunavo/onemoretap/PlayerProfile.kt
          grep -q 'om.kamilunavo.onemoretap.theme.fire' android/app/src/main/java/com/kamilunavo/onemoretap/PlayerProfile.kt
          grep -q 'play-services-ads:25.4.0' android/app/build.gradle.kts
          grep -q 'user-messaging-platform:4.0.0' android/app/build.gradle.kts
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.ads.MobileAdsInitProvider' android/app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' android/app/src/main/AndroidManifest.xml
          grep -q 'Ads are temporarily unavailable.' android/app/src/main/java/com/kamilunavo/onemoretap/AdManager.kt

      - name: Prove release cannot build without Android AdMob IDs
        run: |
          set +e
          gradle -p android bundleRelease --stacktrace > /tmp/navotap-release-guard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release unexpectedly built without production Android AdMob IDs"
            exit 1
          fi
          grep -q 'NavoTap release requires NAVOTAP_ADMOB_APP_ID' /tmp/navotap-release-guard.log

      - name: Upload QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: NavoTap-android-qa-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7

  production_release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAVOTAP_ADMOB_APP_ID: ca-app-pub-8944085355624754~8281696102
      NAVOTAP_REWARDED_AD_ID: ca-app-pub-8944085355624754/1572817522
      NAVOTAP_INTERSTITIAL_AD_ID: ca-app-pub-8944085355624754/1963699766
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore Play upload keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/navotap-upload.jks"
          chmod 600 "$RUNNER_TEMP/navotap-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/navotap-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed production AAB
        run: gradle -p android bundleRelease --stacktrace

      - name: Verify signed production AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          grep -Fq 'versionCode = 2' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.1"' android/app/build.gradle.kts
          grep -Fq 'tools:node="remove"' android/app/src/main/AndroidManifest.xml
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner.txt
          grep -Fq 'jar verified.' /tmp/jarsigner.txt
          cp "$AAB" android/app/build/outputs/bundle/release/NavoTap-1.0.1-2-PlayStore.aab
          sha256sum "$AAB" > android/app/build/outputs/bundle/release/NavoTap-1.0.1-2-PlayStore.aab.sha256

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: NavoTap-1.0.1-2-PlayStore
          path: |
            android/app/build/outputs/bundle/release/NavoTap-1.0.1-2-PlayStore.aab
            android/app/build/outputs/bundle/release/NavoTap-1.0.1-2-PlayStore.aab.sha256
          if-no-files-found: error
          retention-days: 14
