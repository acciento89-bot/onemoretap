name: Apply NavoTap final Android ads fixes

on:
  push:
    branches:
      - android/final-ads-1.0.4-5
    paths:
      - .github/workflows/_apply-final-android-ads.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/final-ads-1.0.4-5
          fetch-depth: 0
      - name: Apply release fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ad = Path('android/app/src/main/java/com/kamilunavo/onemoretap/AdManager.kt')
          s = ad.read_text()
          s = s.replace('    private var rewardedRetryScheduled = false\n', '''    private var rewardedRetryScheduled = false\n    private var interstitialRetryScheduled = false\n    private var rewardedLoading = false\n    private var interstitialLoading = false\n''')
          s = s.replace('''    fun retryRewarded() {\n        rewardedRetryScheduled = false\n        loadRewarded()\n    }\n''', '''    fun retryRewarded(activity: Activity) {\n        rewardedRetryScheduled = false\n        rewardedAvailability = RewardedAvailability.LOADING\n        val consent = consentInformation\n        if (!mobileAdsStarted || consent == null || !consent.canRequestAds()) {\n            consentInitScheduled = false\n            consentInitStarted = false\n            initializeConsentAndAds(activity)\n            return\n        }\n        loadRewarded()\n        loadInterstitial()\n    }\n''')
          old = '''        val ad = interstitialAd\n        if (ad == null) {\n            onComplete()\n            loadInterstitial()\n            return\n        }\n'''
          new = '''        val ad = interstitialAd\n        if (ad == null) {\n            loadInterstitial()\n            // Give a cadence-triggered ad a short chance to finish loading instead of\n            // silently losing restart #4/#7/#10. Never block gameplay for long.\n            handler.postDelayed({\n                if (interstitialAd != null) {\n                    showInterstitialIfReady(activity, onComplete)\n                } else {\n                    onComplete()\n                }\n            }, 1_200L)\n            return\n        }\n'''
          if old not in s:
              raise SystemExit('NavoTap interstitial show anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace('''    private fun loadRewarded() {\n        val consent = consentInformation\n        if (consent == null || !consent.canRequestAds() || !mobileAdsStarted) {\n            rewardedAvailability = RewardedAvailability.UNAVAILABLE\n            return\n        }\n        rewardedAvailability = RewardedAvailability.LOADING\n''', '''    private fun loadRewarded() {\n        val consent = consentInformation\n        if (consent == null || !consent.canRequestAds() || !mobileAdsStarted) {\n            rewardedAvailability = RewardedAvailability.UNAVAILABLE\n            return\n        }\n        if (rewardedAd != null || rewardedLoading) return\n        rewardedLoading = true\n        rewardedAvailability = RewardedAvailability.LOADING\n''')
          s = s.replace('''                    override fun onAdLoaded(ad: RewardedAd) {\n                        rewardedAd = ad\n                        rewardedAvailability = RewardedAvailability.READY\n                        rewardedRetryScheduled = false\n                    }\n\n                    override fun onAdFailedToLoad(error: LoadAdError) {\n                        rewardedAd = null\n                        rewardedAvailability = RewardedAvailability.UNAVAILABLE\n                        scheduleRewardedRetry()\n                    }\n''', '''                    override fun onAdLoaded(ad: RewardedAd) {\n                        rewardedLoading = false\n                        rewardedAd = ad\n                        rewardedAvailability = RewardedAvailability.READY\n                        rewardedRetryScheduled = false\n                    }\n\n                    override fun onAdFailedToLoad(error: LoadAdError) {\n                        rewardedLoading = false\n                        rewardedAd = null\n                        rewardedAvailability = RewardedAvailability.UNAVAILABLE\n                        scheduleRewardedRetry()\n                    }\n''')
          s = s.replace('''        } catch (_: Throwable) {\n            rewardedAd = null\n            rewardedAvailability = RewardedAvailability.UNAVAILABLE\n            scheduleRewardedRetry()\n        }\n    }\n\n    private fun loadInterstitial() {\n''', '''        } catch (_: Throwable) {\n            rewardedLoading = false\n            rewardedAd = null\n            rewardedAvailability = RewardedAvailability.UNAVAILABLE\n            scheduleRewardedRetry()\n        }\n    }\n\n    private fun loadInterstitial() {\n''', 1)
          s = s.replace('''        if (consent == null || !consent.canRequestAds() || !mobileAdsStarted) {\n            interstitialReady = false\n            return\n        }\n        try {\n''', '''        if (consent == null || !consent.canRequestAds() || !mobileAdsStarted) {\n            interstitialReady = false\n            return\n        }\n        if (interstitialAd != null || interstitialLoading) return\n        interstitialLoading = true\n        try {\n''', 1)
          s = s.replace('''                    override fun onAdLoaded(ad: InterstitialAd) {\n                        interstitialAd = ad\n                        interstitialReady = true\n                    }\n\n                    override fun onAdFailedToLoad(error: LoadAdError) {\n                        interstitialAd = null\n                        interstitialReady = false\n                    }\n''', '''                    override fun onAdLoaded(ad: InterstitialAd) {\n                        interstitialLoading = false\n                        interstitialRetryScheduled = false\n                        interstitialAd = ad\n                        interstitialReady = true\n                    }\n\n                    override fun onAdFailedToLoad(error: LoadAdError) {\n                        interstitialLoading = false\n                        interstitialAd = null\n                        interstitialReady = false\n                        scheduleInterstitialRetry()\n                    }\n''')
          s = s.replace('''        } catch (_: Throwable) {\n            interstitialAd = null\n            interstitialReady = false\n        }\n    }\n\n    private fun scheduleRewardedRetry() {\n''', '''        } catch (_: Throwable) {\n            interstitialLoading = false\n            interstitialAd = null\n            interstitialReady = false\n            scheduleInterstitialRetry()\n        }\n    }\n\n    private fun scheduleInterstitialRetry() {\n        if (interstitialRetryScheduled || consentInformation == null || !mobileAdsStarted) return\n        interstitialRetryScheduled = true\n        handler.postDelayed({\n            interstitialRetryScheduled = false\n            loadInterstitial()\n        }, 15_000L)\n    }\n\n    private fun scheduleRewardedRetry() {\n''', 1)
          ad.write_text(s)

          main = Path('android/app/src/main/java/com/kamilunavo/onemoretap/MainActivity.kt')
          s = main.read_text()
          s = s.replace('onClick = ads::retryRewarded, modifier = Modifier.fillMaxWidth()', 'onClick = { ads.retryRewarded(activity) }, modifier = Modifier.fillMaxWidth()')
          main.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text().replace('versionCode = 4', 'versionCode = 5').replace('versionName = "1.0.3"', 'versionName = "1.0.4"')
          gradle.write_text(g)

          for name in ['.github/workflows/android-ci.yml', '.github/workflows/android-release.yml', 'GOOGLE_PLAY.md']:
              p = Path(name)
              if not p.exists():
                  continue
              x = p.read_text()
              x = x.replace('versionCode = 4', 'versionCode = 5')
              x = x.replace('versionName = "1.0.3"', 'versionName = "1.0.4"')
              x = x.replace('1.0.3 (4)', '1.0.4 (5)').replace('1.0.3-4', '1.0.4-5')
              p.write_text(x)
          PY
          git config user.name 'Kamilunavo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android GOOGLE_PLAY.md .github/workflows/android-ci.yml .github/workflows/android-release.yml
          git diff --cached --check
          git commit -m 'fix(android): harden AdMob loading for 1.0.4 (5)'
          git push origin HEAD:android/final-ads-1.0.4-5
