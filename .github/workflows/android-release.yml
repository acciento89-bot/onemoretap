name: NavoTap Android Play Release

on:
  workflow_dispatch:
    inputs:
      admob_app_id:
        description: Android AdMob App ID
        required: true
        type: string
      rewarded_ad_id:
        description: Android rewarded Continue ad unit ID
        required: true
        type: string
      interstitial_ad_id:
        description: Android restart interstitial ad unit ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAVOTAP_ADMOB_APP_ID: ${{ inputs.admob_app_id }}
      NAVOTAP_REWARDED_AD_ID: ${{ inputs.rewarded_ad_id }}
      NAVOTAP_INTERSTITIAL_AD_ID: ${{ inputs.interstitial_ad_id }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate release inputs and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NAVOTAP_ADMOB_APP_ID" =~ ^ca-app-pub-8944085355624754~[0-9]+$ ]]
          [[ "$NAVOTAP_REWARDED_AD_ID" =~ ^ca-app-pub-8944085355624754/[0-9]+$ ]]
          [[ "$NAVOTAP_INTERSTITIAL_AD_ID" =~ ^ca-app-pub-8944085355624754/[0-9]+$ ]]
          test -n '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}'
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          test "$NAVOTAP_ADMOB_APP_ID" != 'ca-app-pub-3940256099942544~3347511713'
          test "$NAVOTAP_REWARDED_AD_ID" != 'ca-app-pub-3940256099942544/5224354917'
          test "$NAVOTAP_INTERSTITIAL_AD_ID" != 'ca-app-pub-3940256099942544/1033173712'

      - name: Restore Play upload keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/navotap-upload.jks"
          chmod 600 "$RUNNER_TEMP/navotap-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/navotap-upload.jks" >> "$GITHUB_ENV"

      - name: Release startup and gameplay tests
        run: gradle -p android testReleaseUnitTest --stacktrace

      - name: Build signed release AAB
        run: gradle -p android bundleRelease --stacktrace

      - name: Verify Play release
        shell: bash
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          grep -Fq 'applicationId = "com.kamilunavo.onemoretap"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 4' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.3"' android/app/build.gradle.kts
          grep -Fq 'isMinifyEnabled = false' android/app/build.gradle.kts
          grep -Fq 'tools:node="remove"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'buildConfigField("boolean", "USES_TEST_ADS", "false")' android/app/build.gradle.kts
          grep -Fq 'if (BuildConfig.DEBUG)' android/app/src/main/java/com/kamilunavo/onemoretap/MainActivity.kt
          grep -Fq 'NAVOTAP ${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})' android/app/src/main/java/com/kamilunavo/onemoretap/MainActivity.kt
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner.txt
          grep -Fq 'jar verified.' /tmp/jarsigner.txt
          sha256sum "$AAB" | tee android/app/build/outputs/bundle/release/NavoTap-1.0.3-4-PlayStore.aab.sha256
          cp "$AAB" android/app/build/outputs/bundle/release/NavoTap-1.0.3-4-PlayStore.aab

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: NavoTap-1.0.3-4-PlayStore
          path: |
            android/app/build/outputs/bundle/release/NavoTap-1.0.3-4-PlayStore.aab
            android/app/build/outputs/bundle/release/NavoTap-1.0.3-4-PlayStore.aab.sha256
          if-no-files-found: error
          retention-days: 14
