name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: navotap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test gameplay rules
        run: swift test --package-path OneMoreTapCore

  ios-build:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Validate source AppIcon
        run: bash ci/check-app-icon.sh OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png source
      - name: Build NavoTap
        run: >-
          xcodebuild
          -project OneMoreTap.xcodeproj
          -scheme NavoTap
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  release-icon-gate:
    name: Release archive AppIcon gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Validate source AppIcon
        run: bash ci/check-app-icon.sh OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png source
      - name: Build unsigned Release archive
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/NavoTapIconGate.xcarchive"
          xcodebuild \
            -project OneMoreTap.xcodeproj \
            -scheme NavoTap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NavoTapIconGate.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Validate compiled Release AppIcons
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NavoTapIconGate.xcarchive/Products/Applications/NavoTap.app"
          test -d "$APP"
          COUNT=0
          while IFS= read -r ICON; do
            [ -n "$ICON" ] || continue
            COUNT=$((COUNT + 1))
            bash ci/check-app-icon.sh "$ICON" "archive:$ICON"
          done < <(find "$APP" -maxdepth 1 -type f -name 'AppIcon*.png' | sort)
          test "$COUNT" -gt 0 || { echo '::error title=AppIcon CI gate::No compiled AppIcon PNG found in Release archive'; exit 1; }
          echo "✓ $COUNT compiled Release AppIcon rendition(s) passed visual integrity checks"
