name: NavoTap TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: 'Type UPLOAD_NAVOTAP_0_2_0_BUILD_2 to upload NavoTap 0.2.0 (2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: navotap-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: TKG684N5GL
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require intentional main-branch upload
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error title=TestFlight guard::Uploads are allowed only from main; got $GITHUB_REF"
            exit 1
          }
          test "$CONFIRM_UPLOAD" = "UPLOAD_NAVOTAP_0_2_0_BUILD_2" || {
            echo "::error title=TestFlight guard::Confirmation phrase does not match NavoTap 0.2.0 (2)"
            exit 1
          }
          echo "✓ Explicit upload confirmation accepted for NavoTap 0.2.0 (2)"

      - name: Select proven Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Validate NavoTap release configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool OneMoreTap/Resources/NavoTap.storekit >/dev/null
          plutil -lint OneMoreTap/Resources/Info.plist
          plutil -lint OneMoreTap.xcodeproj/project.pbxproj

          grep -q 'ca-app-pub-8944085355624754~4792390111' OneMoreTap/Resources/Info.plist
          grep -q 'ca-app-pub-8944085355624754/7162618768' OneMoreTap/Monetization/AdService.swift
          grep -q 'ca-app-pub-8944085355624754/3694930864' OneMoreTap/Monetization/AdService.swift

          if grep -R --exclude='*.md' --exclude='*.storekit' -n 'ca-app-pub-3940256099942544' OneMoreTap; then
            echo "::error title=AdMob preflight::Google sample/test runtime identifier remains in NavoTap"
            exit 1
          fi

          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.kamilunavo.onemoretap;' OneMoreTap.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 0.2.0;' OneMoreTap.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 2;' OneMoreTap.xcodeproj/project.pbxproj
          echo "✓ NavoTap release configuration passed"

      - name: Require App Store Connect credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID" || { echo "::error title=TestFlight credentials::ASC_ISSUER_ID is missing"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "::error title=TestFlight credentials::ASC_KEY_ID is missing"; exit 1; }
          test -n "$ASC_PRIVATE_KEY_B64" || { echo "::error title=TestFlight credentials::ASC_PRIVATE_KEY_B64 is missing"; exit 1; }

      - name: Materialize App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || {
            echo "::error title=TestFlight credentials::ASC API key could not be decoded"
            exit 1
          }

      - name: Archive signed NavoTap Release
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          rm -rf "$RUNNER_TEMP/NavoTap.xcarchive"
          xcodebuild \
            -project OneMoreTap.xcodeproj \
            -scheme NavoTap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NavoTap.xcarchive" \
            -xcconfig Config/Signing.xcconfig \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Verify signed archive identity
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NavoTap.xcarchive/Products/Applications/NavoTap.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")

          test "$BUNDLE_ID" = "com.kamilunavo.onemoretap"
          test "$VERSION" = "0.2.0"
          test "$BUILD" = "2"

          echo "✓ Signed archive identity = $BUNDLE_ID $VERSION ($BUILD)"
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier=|Authority=|TeamIdentifier=' || true

      - name: Create App Store Connect export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload exact build to TestFlight with Apple Cloud Signing
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          rm -rf "$RUNNER_TEMP/TestFlightExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NavoTap.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove App Store Connect API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
